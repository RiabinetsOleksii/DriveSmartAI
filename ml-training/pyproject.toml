[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drivesmart-ml"
version = "0.1.0"
description = "Reproducible GTSRB preparation utilities for DriveSmartAI"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
